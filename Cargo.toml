[workspace]
members = ["crates/never-sleep-core", "crates/never-sleep"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.3"
repository = "https://github.com/SeasonXue/mac-never-sleep"
authors = ["SeasonXue"]

[workspace.dependencies]
never-sleep-core = { path = "crates/never-sleep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
# objc 0.2 `msg_send!` / `sel!` expand `cfg(feature = "cargo-clippy")` into this
# crate. Clippy CI uses `-D warnings`; without check-cfg that is an error.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
