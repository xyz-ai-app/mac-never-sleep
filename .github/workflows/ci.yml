name: CI

# Manual only: do not burn Actions minutes on every push or pull request.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (core + CLI stub)
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker test runtime
        run: npm install --no-package-lock
      - name: Test (Worker, including WebSocket hibernation)
        run: npm test
        env:
          REQUIRE_WORKER_RUNTIME: "1"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test and build
        run: |
          cargo test --workspace
          cargo build -p never-sleep --release
      - name: Package .app
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: never-sleep-app
          path: dist
