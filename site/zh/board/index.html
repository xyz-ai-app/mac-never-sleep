<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Never Sleep — 手机看板</title>
  <meta name="description" content="查看已配对 Mac 的实时状态，并可在手机上开始或结束关屏待命。">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1f28">
  <link rel="canonical" href="https://xyz-ai.app/never-sleep/zh/board/">
  <link rel="alternate" hreflang="en" href="https://xyz-ai.app/never-sleep/board/">
  <link rel="alternate" hreflang="zh-Hans" href="https://xyz-ai.app/never-sleep/zh/board/">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body class="board-page" data-lang="zh">
  <header class="hero">
    <div class="wrap">
      <div class="nav">
        <a class="brand" href="../">
          <img src="../../assets/app-icon.png" width="32" height="32" alt="">
          <span class="brand-name">Never Sleep</span>
        </a>
        <div class="nav-end">
          <div class="language-row" role="navigation" aria-label="语言">
            <a href="../../board/" lang="en" hreflang="en">English</a>
            <a class="selected" href="./" aria-current="page">简体中文</a>
          </div>
        </div>
      </div>
      <div class="hero-copy">
        <p class="kicker">手机看板</p>
        <h1>熟悉的操作，随时掌握。</h1>
        <p class="lede">用「更多设置」里的配对码添加这台 Mac。开始 / 结束关屏待命只作用于你点的那一台。人在键盘前，仍然不会强制关屏。</p>
      </div>
    </div>
  </header>
  <main id="main" class="board-main">
    <div class="wrap">
      <p class="board-note">用手机相机扫描「更多设置」中的二维码，或在下方输入配对码。离线时显示上次状态。</p>
      <form class="pair-form" id="pair-form">
        <input id="pair-code" name="code" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" required spellcheck="false" maxlength="9" placeholder="AB7K-2Q9M" aria-label="配对码">
        <button class="btn btn-primary" type="submit">添加 Mac</button>
      </form>
      <p class="board-error" id="board-error" role="alert" hidden></p>
      <p class="board-empty" id="board-empty">还没有电脑。打开 Never Sleep，把设置里的配对码填到这里。</p>
      <div class="device-list" id="device-list"></div>
    </div>
  </main>
  <script src="../../assets/board.js"></script>
</body>
</html>
